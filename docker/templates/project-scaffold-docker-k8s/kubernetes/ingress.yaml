# last_verified: 2026-08-14 · kubernetes n/a
# Ingress for external access to the web tier. Requires an ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  labels:
    app: multi-service
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-svc
                port:
                  number: 80
