# last_verified: 2026-08-05 · docker n/a

web:
  build: ./web
  ports:
    - "8080:8080"
  environment:
    - DATABASE_HOST=db
    - DATABASE_PORT=5432
    - DATABASE_NAME=appdb
  depends_on:
    - db
  restart: unless-stopped

db:
  image: postgres:16-alpine
  ports:
    - "5432:5432"
  environment:
    POSTGRES_DB: appdb
    POSTGRES_USER: appuser
    POSTGRES_PASSWORD_FILE: /run/secrets/db_password
  volumes:
    - db_data:/var/lib/postgresql/data
  restart: unless-stopped

volumes:
  db_data: