# last_verified: 2026-08-18 · git n/a
# Git INI config for a monorepo: sparse-checkout, partial clone, and conditional includes.
# Drop these into ~/.gitconfig or a repo-local .git/config.

[core]
    # Sparse-checkout limits the working tree to the paths you need.
    sparseCheckout = true
    # Partial clone avoids downloading blobs for omitted paths.
    # Typical values: blob:none, blob:limit=1k, tree:0.
    partialClone = blob:none

# Conditional includes automatically load path-specific settings.
[includeIf "gitdir:~/work/monorepo/frontend/"]
    path = ~/.gitconfig-frontend

[includeIf "gitdir:~/work/monorepo/backend/"]
    path = ~/.gitconfig-backend

[includeIf "gitdir:~/work/monorepo/docs/"]
    path = ~/.gitconfig-docs
