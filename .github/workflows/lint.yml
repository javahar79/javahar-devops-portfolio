name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -type f -name '*.sh' ! -path './.git/*' -exec shellcheck {} +

      - name: Run yamllint
        run: |
          pip install yamllint
          find . -type f \( -name '*.yaml' -o -name '*.yml' \) ! -path './.git/*' -exec yamllint {} +
