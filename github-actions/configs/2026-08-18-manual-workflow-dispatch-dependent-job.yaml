name: Manual deploy
on: {workflow_dispatch: {inputs: {env: {required: true, type: choice, options: [staging, prod]}}}}
jobs:
  build:
    runs-on: ubuntu-latest
    steps: [{run: echo Building ${{ inputs.env }}}]
