# last_verified: 2026-09-13 · Dependabot n/a
# Dependabot version-update configuration for a repo's dependencies.
# Enables weekly checks across ecosystems and groups minor/patch bumps
# into a single pull request to keep review load low.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      main-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "dev-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5