name: Reusable lint-test-deploy pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment target environment
        required: true
        type: string
      lint-command:
        description: Command to run the linter
        required: false
        type: string
        default: "echo 'no lint command configured'"
      test-command:
        description: Command to run the test suite
        required: false
        type: string
        default: "echo 'no test command configured'"
      deploy-command:
        description: Command to run the deployment
        required: false
        type: string
        default: "echo 'no deploy command configured'"
    secrets:
      deploy-token:
        description: Token used during deployment
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run linter
        run: ${{ inputs.lint-command }}

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ${{ inputs.test-command }}

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to environment
        env:
          DEPLOY_TOKEN: ${{ secrets.deploy-token }}
        run: ${{ inputs.deploy-command }}